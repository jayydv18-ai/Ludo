name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_VERSION_RAW=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java Version: $JAVA_VERSION_RAW"
          if [ -z "$JAVA_VERSION_RAW" ]; then
            echo "ERROR: Could not detect Java version."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VERSION_RAW" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -ge 17 ] 2>/dev/null; then
            echo "ERROR: Java version 17 or newer is required. Found: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully (version $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "Checking for debug.keystore..."
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Verifying debug APK at: $EXPECTED_APK"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Listing files in app/build/outputs/apk if directory exists:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_RELEASE_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          REPO_NAME_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME_RAW" ]; then
            REPO_NAME_RAW=$(basename "${{ github.repository }}")
          fi
          SANITIZED_REPO_NAME=$(echo "$REPO_NAME_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "Release asset prepared: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<EOF
          ## 🚀 Debug APK Build #${{ github.run_number }}

          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Intended Use:** Testing and development verification
          - **Note:** This APK is intended for testing and is not a Play Store production release. Signed with a temporary debug keystore.

          ### 📲 Download APK
          Download \`${ASSET_NAME}\` from the Assets list below.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          echo "=== Build & Release Summary ==="
          echo "Release Publish Outcome: $RELEASE_OUTCOME"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            echo "### ✅ Debug APK Built and Published Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download APK:** The APK (\`$ASSET_NAME\`) is available directly in the **Assets** section of the [Release Page]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available on the workflow run page." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing could not be completed, but the debug APK was built successfully."
            echo "The debug APK artifact named 'app-debug-apk' is preserved and available on the workflow summary page."

            echo "### ⚠️ Debug APK Built Successfully (Release Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Build Status:** Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Actions Artifact:** The debug APK (\`app-debug-apk\`) was uploaded and is available for download on this workflow run page." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Status:** Automatic GitHub Release publishing encountered an issue, but the build artifact is safely stored." >> "$GITHUB_STEP_SUMMARY"
          fi
